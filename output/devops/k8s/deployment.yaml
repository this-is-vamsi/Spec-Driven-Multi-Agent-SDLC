apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-inventory-api
  labels:
    app: product-inventory-api
    version: v1
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-inventory-api
  template:
    metadata:
      labels:
        app: product-inventory-api
    spec:
      containers:
      - name: product-inventory-api
        image: ghcr.io/your-repo/product-inventory-api:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: product-inventory-config
        - secretRef:
            name: product-inventory-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      imagePullPolicy: IfNotPresent